; SWExporter.ini - export formats. Lives next to SWExporter.swp.
; Line format:  "Label", ".ext", FLAG, ON|OFF
;   [MODEL]   FLAG = MESH    -> other bodies are hidden, then SaveAs (STL/3MF/GLB/OBJ/images)
;             FLAG = ISOLATE -> each body is copied into a temporary part, saved, closed (STEP/IGES/Parasolid/SAT)
;             FLAG = WHOLE   -> always exports the whole model, never per body (PDF, eDrawings)
;   [DRAWING] FLAG = SINGLE  -> one file per drawing (PDF can be switched to per-sheet in the form)
;             FLAG = MULTI   -> one file per sheet
;   ON/OFF = pre-ticked in the form or not.
;   ".e*" means eDrawings: becomes .eprt / .easm / .edrw automatically.
; Delete this file to use the built-in defaults (identical to this list).

[MODEL]
"STL",          ".stl",  MESH,    ON
"STEP AP214",   ".step", ISOLATE, ON
"IGES",         ".igs",  ISOLATE, OFF
"Parasolid",    ".x_t",  ISOLATE, OFF
"ACIS SAT",     ".sat",  ISOLATE, OFF
"3MF",          ".3mf",  MESH,    OFF
"GLB",".glb",  MESH,    OFF
"OBJ", ".obj", MESH, OFF
"JPEG image",   ".jpg",  MESH,    OFF
"PNG image",    ".png",  MESH,    OFF
"eDrawings",    ".e*",   WHOLE,   OFF
"3D PDF",       ".pdf",  WHOLE,   OFF

[DRAWING]
"PDF",          ".pdf",  SINGLE,  ON
"eDrawings",    ".edrw", SINGLE,  OFF
"DWG",          ".dwg",  MULTI,   OFF
"DXF",          ".dxf",  MULTI,   OFF
"JPEG",         ".jpg",  MULTI,   OFF
"PNG",          ".png",  MULTI,   OFF
